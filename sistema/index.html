<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Sistema Lantur</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Montserrat:wght@500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

*{box-sizing:border-box}body{margin:0;background:var(--f);color:var(--a);font:500 15px/1.45 var(--ui)}[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--v);outline-offset:1px}
.g{padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:0;z-index:5;background:var(--m);color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding-block:9px}.bar img{height:44px;display:block}
nav{display:flex;gap:3px;flex:1 1 300px;overflow-x:auto}nav button{background:none;border:0;color:#fff;padding:8px 11px;border-radius:6px;font-weight:600;cursor:pointer;white-space:nowrap}nav button.on{background:#fff;color:var(--m)}
.quem{font-size:.85rem;display:flex;gap:10px;align-items:center}
.btn{background:var(--l);color:var(--a);border:0;border-radius:6px;padding:9px 14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.btn.s{background:#fff;border:1px solid var(--ln)}.btn.o{background:none;border:1px solid var(--c);color:#fff;padding:6px 10px}.btn.x{background:none;border:1px solid var(--er);color:var(--er)}.btn.p{padding:5px 9px;font-size:.84rem}
main{padding-block:18px 50px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;max-width:1400px;margin:auto}
.tit{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}.tit h1{font-size:1.35rem;font-weight:800}.fl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fl input,.fl select{padding:8px 10px;border:1px solid var(--ln);border-radius:6px;background:#fff;min-width:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.card{background:#fff;border-radius:10px;padding:14px 16px;min-width:0}.card b{display:block;font-size:1.55rem;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.card span{font-size:.84rem;color:var(--s)}.card.al b{color:var(--er)}
.pb{height:10px;background:var(--ln);border-radius:9px;overflow:hidden;margin-top:8px}.pb i{display:block;height:100%;background:var(--l)}
.pn{background:#fff;border-radius:10px;overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:760px}th{font:500 .71rem var(--mn);letter-spacing:.05em;text-transform:uppercase;text-align:left;color:var(--s);padding:11px 12px;white-space:nowrap}td{border-top:1px solid var(--ln);padding:10px 12px;vertical-align:middle}tr.c{cursor:pointer}tr.c:hover td{background:var(--f)}.n{font-variant-numeric:tabular-nums;white-space:nowrap}tfoot td{font-weight:700}
.vz{padding:26px;text-align:center;color:var(--s)}h2.t{font-size:1rem;font-weight:700}
.tag{font:500 .72rem var(--mn);padding:2px 8px;border-radius:99px;background:var(--f);white-space:nowrap}.tag.r{background:#fde8e6;color:var(--er)}.tag.a{background:#fff0dc;color:var(--am)}.tag.g{background:#e2f4ea;color:var(--ok)}
dialog{border:0;padding:0;margin:0 0 0 auto;height:100%;max-height:100%;width:min(560px,100%);max-width:100%;background:#fff;color:var(--a)}dialog::backdrop{background:rgb(11 31 77/.5)}
.fm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:18px}.fm h2{grid-column:1/-1;font-size:1.2rem;font-weight:800}.fd{display:grid;gap:3px;min-width:0}.fd.w,.fm .w{grid-column:1/-1}.fd label{font:500 .72rem var(--mn);text-transform:uppercase;color:var(--s)}.fd input,.fd select,.fd textarea{width:100%;min-width:0;padding:9px;border:1px solid var(--ln);border-radius:6px;background:#fff}.ck{grid-column:1/-1;display:flex;gap:8px;align-items:center}.ac{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}.calc{grid-column:1/-1;background:var(--f);border-radius:8px;padding:10px 12px;font-size:.92rem}
.err{color:var(--er);font-weight:600;font-size:.9rem}
#lg{min-height:100vh;display:grid;place-items:center;background:var(--m);padding:20px}#lg form{background:#fff;border-radius:14px;padding:26px;width:min(380px,100%);display:grid;gap:12px}#lg img{height:62px;justify-self:center;background:var(--m);padding:8px 14px;border-radius:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--a);color:#fff;padding:10px 16px;border-radius:8px;z-index:20}
@media(max-width:480px){.fm{grid-template-columns:minmax(0,1fr)}}
</style></head><body>

const FU=()=>{const now=new Date(),P=S.propostas,hj=hoje();return{fechar:P.filter(p=>p.status==="Quer fechar"),vence:P.filter(p=>VIVA(p)&&new Date(p.validade)>now&&new Date(p.validade)<=HRS(24)&&!ADI(p)),viu:P.filter(p=>p.status==="Vista"&&new Date(p.validade)>HRS(24)&&!ADI(p)&&new Date(p.ultimo_lembrete||p.ultima_vista)<=HRS(-24)),nao:P.filter(p=>p.status==="Enviada"&&new Date(p.validade)>HRS(24)&&!ADI(p)&&new Date(p.ultimo_lembrete||p.criado_em)<=HRS(-24)),venc:P.filter(p=>VIVA(p)&&new Date(p.validade)<=now&&new Date(p.validade)>HRS(-360)&&!ADI(p)),neg:P.filter(p=>p.status==="Em negociação"&&new Date(p.validade)>HRS(24)&&!ADI(p)&&new Date(p.ultimo_lembrete||p.alterado_em||p.criado_em)<=HRS(-24)),novos:S.leads.filter(l=>["Novo","Incompleto"].includes(l.status)),ret:S.leads.filter(l=>l.proximo&&l.proximo<=hj&&!["Fechado","Perdido","Novo","Incompleto"].includes(l.status)),tar:S.tarifas.filter(t=>t.status==="Aguardando"&&t.conferir_em<=hj),fila:S.tarifas.filter(t=>t.status==="Aguardando"&&t.conferir_em>hj)}};
const totFU=()=>{const f=FU();return ["fechar","vence","viu","nao","venc","neg","novos","ret","tar"].reduce((a,k)=>a+f[k].length,0)};
const lPr=(t,a,msg)=>a.length?`<h2 class="t">${t} (${a.length})</h2><div class="pn"><table><tbody>${a.map(p=>`<tr><td><b>${e(p.cliente_nome)}</b><br><small>${e(p.titulo)}${p.opcao_escolhida?" · "+e(p.opcao_escolhida):""}</small></td><td class="n">Validade ${dtBr(p.validade)}<br><small>${p.vistas?"Abriu "+p.vistas+"x, "+dtBr(p.ultima_vista):"Não abriu"}${p.ultimo_lembrete?" · lembrado "+dtBr(p.ultimo_lembrete):""}</small></td><td><span class="fl">${btW(p.cliente_whats,msg(p))}<button class="btn s p" data-fu="lem" data-id="${p.id}">Já lembrei</button><button class="btn s p" data-fu="res" data-id="${p.id}">Respondeu</button><button class="btn s p" data-fu="ver" data-id="${p.id}">Abrir</button><button class="btn x p" data-fu="per" data-id="${p.id}">Perdida</button></span></td></tr>`).join("")}</tbody></table></div>`:"";
function acomp(){const f=FU(),tot=totFU();const novos=f.novos.length?`<h2 class="t">Pediram orçamento e ninguém atendeu (${f.novos.length})</h2><div class="pn"><table><tbody>${f.novos.map(l=>`<tr><td><b>${e(l.nome||"Sem nome")}</b><br><small>${e(l.origem)} · ${e(l.status)}</small></td><td>${e(l.destino)}</td><td><span class="fl">${btW(l.whatsapp,"Olá"+(l.nome?", "+String(l.nome).split(" ")[0]:"")+"! Aqui é da Lantur. Recebemos seu pedido"+(l.destino?" para "+l.destino:"")+". Para quando você pensa em viajar?")}<button class="btn s p" data-fu="lat" data-id="${l.id}">Já chamei</button><button class="btn s p" data-fu="lpr" data-id="${l.id}">Criar proposta</button></span></td></tr>`).join("")}</tbody></table></div>`:"";
 const ret=f.ret.length?`<h2 class="t">Retornos marcados para hoje (${f.ret.length})</h2><div class="pn"><table><tbody>${f.ret.map(l=>`<tr class="c" data-e="lead" data-id="${l.id}"><td><b>${e(l.nome||l.whatsapp)}</b><br><small>${e(l.obs||l.destino)}</small></td><td class="n">${br(l.proximo)}</td><td>${btW(l.whatsapp,"Olá"+(l.nome?", "+String(l.nome).split(" ")[0]:"")+"! Aqui é da Lantur, voltando sobre sua viagem.")}</td></tr>`).join("")}</tbody></table></div>`:"";
 const lT=(a,t)=>a.length?`<h2 class="t">${t} (${a.length})</h2><div class="pn"><table><tbody>${a.map(x=>`<tr class="c" data-e="tarifa" data-id="${x.id}"><td><b>${e(x.nome)}</b><br><small>${e(x.destino)}</small></td><td class="n">${br(x.ida)}${x.volta?" – "+br(x.volta):""}<br><small>Conferir em ${br(x.conferir_em)}</small></td><td><span class="fl"><button class="btn p" data-fu="tlib" data-id="${x.id}">Tarifa liberada</button><button class="btn s p" data-fu="tadi" data-id="${x.id}">Conferir em 7 dias</button></span></td></tr>`).join("")}</tbody></table></div>`:"";
 const vazio=!tot?vz("Tudo em dia. Nenhuma pendência agora."):"";
 return `<div class="tit"><h1>Acompanhamento</h1><button class="btn" data-n="tarifa">Aguardando tarifa</button></div><div class="cards">${cd(f.fechar.length,"Querem fechar",f.fechar.length)}${cd(f.vence.length,"Vencem em até 24h",f.vence.length)}${cd(f.viu.length+f.nao.length+f.neg.length,"Sem retorno")}${cd(f.novos.length,"Sem atendimento",f.novos.length)}${cd(f.tar.length,"Conferir tarifa",f.tar.length)}</div>${vazio}${lPr("Querem fechar agora",f.fechar,p=>`Olá, ${String(p.cliente_nome).split(" ")[0]}! Vi que você quer fechar sua viagem para ${p.titulo}. Vamos emitir?`)}${lPr("Vencem em até 24 horas",f.vence,txtLem)}${novos}${lT(f.tar,"Conferir se a tarifa já abriu")}${ret}${lPr("Viram e não responderam",f.viu,txtLem)}${lPr("Ainda não abriram",f.nao,txtLem)}${lPr("Em negociação sem retorno",f.neg,txtLem)}${lPr("Venceram sem resposta",f.venc,p=>`Olá, ${String(p.cliente_nome).split(" ")[0]}! Sua proposta para ${p.titulo} venceu. Quer que eu verifique os valores de hoje?`)}${lT(f.fila,"Na fila, aguardando a data")}`}
document.addEventListener("click",async ev=>{const t=ev.target,k=t.dataset.fu;if(!k)return;ev.stopPropagation();const id=t.dataset.id,pp=b=>q(sb.from("propostas").update(b).eq("id",id));try{if(k==="lem"){await pp({ultimo_lembrete:new Date().toISOString(),proximo_lembrete:new Date(HRS(48)).toISOString()});return rec("Volta em 2 dias")}if(k==="res"){await pp({status:"Em negociação",ultimo_lembrete:new Date().toISOString(),proximo_lembrete:new Date(HRS(48)).toISOString()});return rec("Em negociação")}if(k==="per"){if(t.dataset.c!=="1"){t.dataset.c="1";t.textContent="Confirmar";return}await pp({status:"Perdida"});return rec("Marcada como perdida")}if(k==="ver")return abrirProp(S.propostas.find(x=>x.id===id));if(k==="lat"){await q(sb.from("leads").update({status:"Cotando",atualizado:new Date().toISOString()}).eq("id",id));return rec("Em cotação")}if(k==="lpr"){const l=S.leads.find(x=>x.id===id);return abrirProp(null,{cliente_nome:l.nome,cliente_whats:l.whatsapp,titulo:l.destino})}if(k==="tlib"){const x=S.tarifas.find(y=>y.id===id);await q(sb.from("aguardando_tarifa").update({status:"Liberada"}).eq("id",id));await carregar();tela();return abrirProp(null,{cliente_nome:x.nome,cliente_whats:x.whatsapp,titulo:x.destino})}if(k==="tadi"){await q(sb.from("aguardando_tarifa").update({conferir_em:addDias(hoje(),7)}).eq("id",id));return rec("Volta em 7 dias")}}catch(x){toast("Não consegui salvar.")}},true);
const digW=x=>wa(x).replace(/\D/g,"");
function histCli(l){const w=digW(l.whatsapp),n=String(l.nome||"").trim().toLowerCase(),a=S.vendas.filter(v=>(v.whatsapp&&digW(v.whatsapp)===w)||(n&&String(v.pax_nome||"").trim().toLowerCase()===n)).sort((x,y)=>(x.embarque||x.data_venda||"")<(y.embarque||y.data_venda||"")?1:-1);if(!a.length)return '<div class="calc"><b>Histórico de viagens</b><br>Nenhuma viagem registrada.</div>';const tot=a.reduce((t,v)=>t+(+v.valor_venda||0),0),top=f=>{const c={};a.forEach(v=>{if(v[f])c[v[f]]=(c[v[f]]||0)+1});return Object.keys(c).sort((x,y)=>c[y]-c[x])[0]||""},M=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"],ms={};a.forEach(v=>{if(v.embarque){const m=+v.embarque.slice(5,7)-1;ms[m]=(ms[m]||0)+1}});const mf=Object.keys(ms).sort((x,y)=>ms[y]-ms[x])[0];return `<div class="calc"><b>Histórico de viagens</b><br>${a.length} viagem(ns) · ${R(tot)} no total · média ${R(tot/a.length)}${top("padrao")?"<br>Padrão: "+e(top("padrao")):""}${top("tipo_viagem")?" · Tipo: "+e(top("tipo_viagem")):""}${top("companhia")?" · Com: "+e(top("companhia")):""}${mf!==undefined?"<br>Costuma viajar em: "+M[mf]:""}<div style="margin-top:8px;display:grid;gap:4px">${a.map(v=>`<div>${br(v.embarque||v.data_venda)} · <b>${e(v.destino||"Sem destino")}</b> · ${R(v.valor_venda)}${v.padrao?" · "+e(v.padrao):""}</div>`).join("")}</div></div>`}
let recup=false;const lerr=t=>{$("lr").textContent=t;$("lr").hidden=!t};
function modoSenha(){recup=true;$("lg").hidden=false;$("app").hidden=true;$("le").closest(".fd").hidden=true;$("lp").autocomplete="new-password";$("lpw").querySelector("label").textContent="Crie sua nova senha (mínimo 10 caracteres)";$("lp").value="";$("lb").textContent="Salvar senha";$("lf").hidden=true}
$("fl").addEventListener("submit",async ev=>{ev.preventDefault();lerr("");if(recup){if($("lp").value.length<10)return lerr("Use pelo menos 10 caracteres.");const r=await sb.auth.updateUser({password:$("lp").value});if(r.error)return lerr("Não consegui salvar. Peça um novo link.");recup=false;location.hash="";location.reload();return}const r=await sb.auth.signInWithPassword({email:$("le").value.trim(),password:$("lp").value});if(r.error)lerr("E-mail ou senha incorretos.")});
$("lf").onclick=async()=>{const m=$("le").value.trim();if(!m)return lerr("Digite seu e-mail primeiro.");await sb.auth.resetPasswordForEmail(m,{redirectTo:location.origin+location.pathname});lerr("");toast("Se o e-mail estiver cadastrado, enviamos um link.")};
async function entrar(sess){if(recup)return;if(!sess){eu=null;$("app").hidden=true;$("lg").hidden=false;return}$("lg").hidden=true;try{eu=(await q(sb.from("perfis").select("*").eq("id",sess.user.id).single()));if(!eu.ativo){await sb.auth.signOut();lerr("Seu acesso ainda não foi liberado.");return}$("qm").textContent=eu.nome;$("app").hidden=false;await carregar();tela()}catch(x){$("app").hidden=false;$("m").innerHTML=vz("Não consegui carregar seus dados. Atualize a página.")}}
if(/type=(recovery|invite)/.test(location.hash))modoSenha();
sb.auth.onAuthStateChange((ev,s)=>{if(ev==="PASSWORD_RECOVERY"){modoSenha();return}if(ev==="SIGNED_IN"||ev==="INITIAL_SESSION"||ev==="SIGNED_OUT")setTimeout(()=>{if(!eu||ev!=="SIGNED_IN")entrar(s)},0)});
</script></body></html>
